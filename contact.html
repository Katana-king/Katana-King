<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-key="contact.title">Katana-King - Contact Me</title>
    <meta name="description" content="Contact Katana-King for custom web development, gaming collaborations, or inquiries. Answer an incoming call or use the chat form.">
    <meta name="keywords" content="Katana-King, contact, web development, gaming, full-stack developer">
    <meta name="author" content="Katana-King">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="preload" href="8.gif" as="image">
    <link rel="preload" href="menu.mp3" as="audio" type="audio/mp3">
    <link rel="preload" href="notification.mp3" as="audio" type="audio/mp3">
    <link rel="preload" href="incomingcall.mp3" as="audio" type="audio/mp3">
    <link rel="preload" href="respond.mp3" as="audio" type="audio/mp3">
    <link rel="preload" href="talk.mp3" as="audio" type="audio/mp3">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            color: #e0e0e0;
            overflow-x: hidden;
            position: relative;
            background: linear-gradient(135deg, #0f0f0f 0%, #1c2526 100%);
            transition: background 0.5s ease, color 0.5s ease;
        }
        body.crt-effect {
            background: #000;
            color: #00ff00;
            font-family: "Courier New", monospace;
        }
        body.crt-effect .content-overlay,
        body.crt-effect .contact-form,
        body.crt-effect .chat-box,
        body.crt-effect .entry-prompt-content,
        body.crt-effect .call-overlay {
            background: transparent;
            color: #00ff00;
        }
        body.crt-effect .contact-form input,
        body.crt-effect .contact-form textarea,
        body.crt-effect .chat-box .bot-message,
        body.crt-effect .chat-box .user-message {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
        }
        body.crt-effect .contact-form button,
        body.crt-effect .entry-prompt button,
        body.crt-effect .call-action-button {
            background: #003300;
            border: 1px solid #00ff00;
            color: #00ff00;
        }
        body.crt-effect .contact-form button:hover,
        body.crt-effect .contact-form button:active,
        body.crt-effect .entry-prompt button:hover,
        body.crt-effect .entry-prompt button:active,
        body.crt-effect .call-action-button:hover,
        body.crt-effect .call-action-button:active {
            background: #004400;
        }
        body.crt-effect .typing-indicator {
            color: #00cc00;
        }
        body.crt-effect .call-overlay .call-text {
            text-shadow: 0 0 5px #00ff00;
        }
        body.crt-effect::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%,
                rgba(0, 0, 0, 0.25) 50%
            );
            background-size: 100% 4px;
            z-index: 1000;
            pointer-events: none;
        }
        body.crt-effect::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            z-index: 999;
            pointer-events: none;
        }
        .background-gif {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
            opacity: 0.7;
            loading: lazy;
        }
        body.crt-effect .background-gif {
            filter: brightness(0.5) contrast(1.2) sepia(1) hue-rotate(90deg) saturate(2);
            opacity: 0.3;
        }
        .content-overlay {
            position: relative;
            z-index: 1;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(5px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .contact-form {
            background: rgba(255, 255, 255, 0.05);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.5);
            max-width: 500px;
            width: 90%;
            display: none;
        }
        .contact-form h2 {
            text-align: center;
            font-size: 2rem;
            margin-bottom: 1.5rem;
        }
        .contact-form label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }
        .contact-form input,
        .contact-form textarea {
            width: 100%;
            padding: 0.5rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
        }
        .contact-form button {
            background: #ff6b6b;
            color: #e0e0e0;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-size: 1rem;
            min-width: 120px;
        }
        .contact-form button:hover,
        .contact-form button:active {
            background: #e55a5a;
        }
        .chat-box {
            height: 300px;
            overflow-y: auto;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }
        .message {
            display: flex;
            align-items: center;
            margin: 0.5rem 0;
            max-width: 80%;
        }
        .bot-message {
            background: #4a5568;
            border-radius: 8px;
            padding: 0.5rem 1rem;
        }
        .user-message {
            background: #2d3748;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            margin-left: auto;
        }
        .message img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin: 0 0.5rem;
        }
        .bot-message img {
            order: -1;
        }
        .typing-indicator {
            display: none;
            font-style: italic;
            color: #a0aec0;
        }
        .call-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            color: #e0e0e0;
        }
        .call-overlay img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 1rem;
            position: relative;
            animation: pulse 2s infinite;
        }
        .call-overlay .call-text {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            font-weight: bold;
        }
        .call-overlay .call-action-button {
            background: #ff6b6b;
            color: #e0e0e0;
            padding: 1rem 2rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s ease, transform 0.3s ease;
            font-size: 1.2rem;
            margin: 0.5rem;
        }
        .call-overlay .call-action-button.accept {
            background: #2ecc71;
        }
        .call-overlay .call-action-button.accept:hover,
        .call-overlay .call-action-button.accept:active {
            background: #27ae60;
            transform: scale(1.05);
        }
        .call-overlay .call-action-button.end {
            background: #e74c3c;
        }
        .call-overlay .call-action-button.end:hover,
        .call-overlay .call-action-button.end:active {
            background: #c0392b;
            transform: scale(1.05);
        }
        .call-overlay .call-buttons {
            display: flex;
            gap: 1rem;
        }
        .weak-signal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('static-noise.png') repeat;
            opacity: 0;
            pointer-events: none;
            animation: weakSignal 3s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 20px rgba(255, 107, 107, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 107, 107, 0); }
        }
        @keyframes weakSignal {
            0%, 100% { opacity: 0; }
            50% { opacity: 0.3; }
        }
        #particles-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .entry-prompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
            animation: fadeIn 0.5s ease-in-out;
        }
        .entry-prompt-content {
            position: relative;
            z-index: 3;
            text-align: center;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 8px;
            max-width: 90%;
        }
        .entry-prompt button {
            margin-top: 1rem;
            background: #ff6b6b;
            color: #e0e0e0;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-size: 1rem;
            min-width: 120px;
        }
        .entry-prompt button:hover,
        .entry-prompt button:active {
            background: #e55a5a;
        }
        .entry-prompt img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 2;
            opacity: 0.7;
            loading: lazy;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @media (max-width: 768px) {
            .contact-form { padding: 1rem; }
            .contact-form h2 { font-size: 1.5rem; }
            .contact-form input,
            .contact-form textarea { font-size: 0.9rem; }
            .contact-form button,
            .call-action-button { padding: 0.5rem 1rem; font-size: 0.9rem; }
            .entry-prompt-content { padding: 1rem; }
            .entry-prompt button { padding: 0.5rem 1rem; font-size: 0.9rem; }
            .message img { width: 32px; height: 32px; }
            .call-overlay img { width: 80px; height: 80px; }
            .call-overlay .call-text { font-size: 1.2rem; }
            .call-overlay .call-action-button { padding: 0.75rem 1.5rem; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <img src="8.gif" alt="Contact background animation" class="background-gif" loading="lazy">
    <div id="particles-js"></div>

    <!-- Entry Prompt -->
    <div class="entry-prompt" id="entryPrompt" role="dialog" aria-labelledby="entryPromptTitle">
        <div id="particles-js"></div>
        <img src="8.gif" alt="Welcome animation for contact page" loading="lazy">
        <div class="entry-prompt-content">
            <h2 id="entryPromptTitle" class="text-xl md:text-2xl font-bold mb-4" data-key="contact.welcome">Contact Katana-King</h2>
            <p data-key="contact.enter_prompt">Would you like to enter the contact page or go back?</p>
            <div class="flex gap-4 mt-4">
                <button onclick="enterSite()" aria-label="Enter the contact page" data-key="contact.enter">Enter</button>
                <button onclick="goBack()" aria-label="Go back to previous page" data-key="contact.back">Back</button>
            </div>
        </div>
    </div>

    <!-- Call Overlay -->
    <div class="call-overlay" id="callOverlay">
        <div class="weak-signal" id="weakSignal"></div>
        <img src="katana-king-avatar.png" alt="Katana-King avatar" loading="lazy">
        <div class="call-text" id="callText" data-key="contact.incoming">Incoming Call from Katana-King...</div>
        <div class="call-buttons" id="callButtons">
            <button class="call-action-button accept" onclick="acceptCall()" aria-label="Accept call" data-key="contact.accept">Accept</button>
            <button class="call-action-button end" onclick="declineCall()" aria-label="Decline call" data-key="contact.decline">Decline</button>
        </div>
    </div>

    <!-- Contact Form -->
    <div class="content-overlay">
        <div class="contact-form" id="contactForm">
            <h2 data-key="contact.title">Contact Me</h2>
            <div id="initialForm">
                <label for="name" data-key="contact.name_label">Name</label>
                <input type="text" id="name" name="name" required data-key="contact.name_placeholder">

                <label for="email" data-key="contact.email_label">Email</label>
                <input type="email" id="email" name="email" required data-key="contact.email_placeholder">

                <div class="flex gap-4 justify-center">
                    <button onclick="startChat()" aria-label="Start chat" data-key="contact.start_chat">Start Chat</button>
                    <button onclick="window.location.href='index.html'" aria-label="Go back to home page" data-key="contact.back_home">Back to Home</button>
                </div>
            </div>
            <div id="chatInterface" style="display: none;">
                <div class="chat-header">
                    <h3 class="text-lg font-semibold" data-key="contact.chat_title">Chat with Katana-King</h3>
                </div>
                <div id="chatBox" class="chat-box">
                    <div id="typingIndicator" class="typing-indicator" data-key="contact.typing">Katana-King is typing...</div>
                </div>
                <form id="messageForm" action="https://formsubmit.co/brahimiahmed995@gmail.com" method="POST">
                    <input type="hidden" id="formName" name="name">
                    <input type="hidden" id="formEmail" name="email">
                    <textarea id="message" name="message" required rows="4" data-key="contact.message_placeholder"></textarea>
                    <div class="flex gap-4 justify-center">
                        <button type="submit" aria-label="Send message" data-key="contact.send">Send Message</button>
                        <button type="button" onclick="window.location.href='index.html'" aria-label="Go back to home page" data-key="contact.back_home">Back to Home</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <audio id="backgroundAudio" loop aria-hidden="true"><source src="menu.mp3" type="audio/mp3"></audio>
    <audio id="notificationSound" aria-hidden="true"><source src="notification.mp3" type="audio/mp3"></audio>
    <audio id="incomingCallSound" loop aria-hidden="true"><source src="incomingcall.mp3" type="audio/mp3"></audio>
    <audio id="respondSound" aria-hidden="true"><source src="respond.mp3" type="audio/mp3"></audio>
    <audio id="talkSound" aria-hidden="true"><source src="talk.mp3" type="audio/mp3"></audio>

    <script>
        // FULL TRANSLATION SYSTEM (including the bot message!)
        const translations = {
            en: {
                "contact.title": "Katana-King - Contact Me",
                "contact.welcome": "Contact Katana-King",
                "contact.enter_prompt": "Would you like to enter the contact page or go back?",
                "contact.enter": "Enter",
                "contact.back": "Back",
                "contact.incoming": "Incoming Call from Katana-King...",
                "contact.accept": "Accept",
                "contact.decline": "Decline",
                "contact.name_label": "Name",
                "contact.name_placeholder": "Your name",
                "contact.email_label": "Email",
                "contact.email_placeholder": "Your email",
                "contact.start_chat": "Start Chat",
                "contact.back_home": "Back to Home",
                "contact.chat_title": "Chat with Katana-King",
                "contact.typing": "Katana-King is typing...",
                "contact.message_placeholder": "Type your message...",
                "contact.send": "Send Message",
                "contact.bot_first_message": "Hello, how can I help you?"
            },
            fr: {
                "contact.title": "Katana-King - Contactez-moi",
                "contact.welcome": "Contacter Katana-King",
                "contact.enter_prompt": "Voulez-vous entrer ou revenir en arrière ?",
                "contact.enter": "Entrer",
                "contact.back": "Retour",
                "contact.incoming": "Appel entrant de Katana-King...",
                "contact.accept": "Accepter",
                "contact.decline": "Refuser",
                "contact.name_label": "Nom",
                "contact.name_placeholder": "Votre nom",
                "contact.email_label": "Email",
                "contact.email_placeholder": "Votre email",
                "contact.start_chat": "Démarrer le chat",
                "contact.back_home": "Retour à l'accueil",
                "contact.chat_title": "Discussion avec Katana-King",
                "contact.typing": "Katana-King est en train d'écrire...",
                "contact.message_placeholder": "Tapez votre message...",
                "contact.send": "Envoyer",
                "contact.bot_first_message": "Bonjour, comment puis-je vous aider ?"
            },
            ar: {
                "contact.title": "كاتانا كينج - تواصل معي",
                "contact.welcome": "تواصل مع كاتانا كينج",
                "contact.enter_prompt": "هل تريد الدخول أم العودة؟",
                "contact.enter": "دخول",
                "contact.back": "رجوع",
                "contact.incoming": "مكالمة واردة من كاتانا كينج...",
                "contact.accept": "قبول",
                "contact.decline": "رفض",
                "contact.name_label": "الاسم",
                "contact.name_placeholder": "اسمك",
                "contact.email_label": "البريد الإلكتروني",
                "contact.email_placeholder": "بريدك الإلكتروني",
                "contact.start_chat": "بدء المحادثة",
                "contact.back_home": "الرجوع للرئيسية",
                "contact.chat_title": "الدردشة مع كاتانا كينج",
                "contact.typing": "كاتانا كينج يكتب...",
                "contact.message_placeholder": "اكتب رسالتك...",
                "contact.send": "إرسال الرسالة",
                "contact.bot_first_message": "مرحباً، كيف يمكنني مساعدتك؟"
            },
            ru: {
                "contact.title": "Katana-King — Связаться со мной",
                "contact.welcome": "Связаться с Katana-King",
                "contact.enter_prompt": "Хотите войти или вернуться назад?",
                "contact.enter": "Войти",
                "contact.back": "Назад",
                "contact.incoming": "Входящий вызов от Katana-King...",
                "contact.accept": "Принять",
                "contact.decline": "Отклонить",
                "contact.name_label": "Имя",
                "contact.name_placeholder": "Ваше имя",
                "contact.email_label": "Email",
                "contact.email_placeholder": "Ваш email",
                "contact.start_chat": "Начать чат",
                "contact.back_home": "На главную",
                "contact.chat_title": "Чат с Katana-King",
                "contact.typing": "Katana-King печатает...",
                "contact.message_placeholder": "Введите сообщение...",
                "contact.send": "Отправить",
                "contact.bot_first_message": "Привет! Чем могу помочь?"
            }
        };

        // Apply language + translate first message
        document.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('language') || 'en';
            document.documentElement.lang = savedLang;
            document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';

            // Translate all data-key elements
            document.querySelectorAll('[data-key]').forEach(el => {
                const key = el.dataset.key;
                if (translations[savedLang] && translations[savedLang][key]) {
                    if (el.hasAttribute('placeholder')) {
                        el.setAttribute('placeholder', translations[savedLang][key]);
                    } else {
                        el.textContent = translations[savedLang][key];
                    }
                }
            });

            // Translate page title
            document.title = translations[savedLang]["contact.title"];
        });

        // Your full original JavaScript (unchanged except first message translation)
        window.addEventListener('load', () => {
            particlesJS('particles-js', {
                particles: {
                    number: { value: window.innerWidth < 768 ? 30 : 50, density: { enable: true, value_area: 800 } },
                    color: { value: '#ff6b6b' },
                    shape: { type: 'circle', stroke: { width: 0, color: '#000000' } },
                    opacity: { value: 0.5, random: true, anim: { enable: true, speed: 0.7, opacity_min: 0.1 } },
                    size: { value: 3, random: true, anim: { enable: false } },
                    line_linked: { enable: true, distance: 100, color: '#ff6b6b', opacity: 0.3, width: 1 },
                    move: { enable: true, speed: 3, direction: 'none', random: true, straight: false, out_mode: 'out' }
                },
                interactivity: {
                    detect_on: 'canvas',
                    events: {
                        onhover: { enable: window.innerWidth >= 768, mode: 'grab' },
                        onclick: { enable: true, mode: 'push' },
                        resize: true
                    },
                    modes: {
                        grab: { distance: 150, line_linked: { opacity: 0.5 } },
                        push: { particles_nb: 2 }
                    }
                },
                retina_detect: true
            });
        });

        // All your existing functions (enterSite, call, chat, etc.) stay 100% the same
        const audio = document.getElementById('backgroundAudio');
        const notificationSound = document.getElementById('notificationSound');
        const incomingCallSound = document.getElementById('incomingCallSound');
        const respondSound = document.getElementById('respondSound');
        const talkSound = document.getElementById('talkSound');
        const entryPrompt = document.getElementById('entryPrompt');
        const contactForm = document.getElementById('contactForm');
        const callOverlay = document.getElementById('callOverlay');
        const callText = document.getElementById('callText');
        const weakSignal = document.getElementById('weakSignal');
        const callButtons = document.getElementById('callButtons');

        audio.muted = false;
        notificationSound.muted = false;
        incomingCallSound.muted = false;
        respondSound.muted = false;
        talkSound.muted = false;
        contactForm.style.display = 'none';
        callOverlay.style.display = 'none';

        function enterSite() {
            entryPrompt.style.display = 'none';
            callOverlay.style.display = 'flex';
            callText.textContent = translations[localStorage.getItem('language') || 'en']["contact.incoming"];
            callButtons.style.display = 'flex';
            incomingCallSound.play().catch(() => {});
        }

        function goBack() {
            audio.pause();
            window.history.back();
        }

        let callTimerInterval;
        function acceptCall() {
            incomingCallSound.pause();
            callText.textContent = 'In Call – 00:00';
            callButtons.innerHTML = `<button class="call-action-button end" onclick="declineCall()">${translations[localStorage.getItem('language') || 'en']["contact.decline"]}</button>`;
            respondSound.play().then(() => {
                talkSound.play();
                talkSound.onended = () => setTimeout(declineCall, 2000);
            });

            let seconds = 0;
            callTimerInterval = setInterval(() => {
                seconds++;
                const m = String(Math.floor(seconds / 60)).padStart(2, '0');
                const s = String(seconds % 60).padStart(2, '0');
                callText.textContent = `In Call – ${m}:${s}`;
            }, 1000);
        }

        function declineCall() {
            incomingCallSound.pause();
            respondSound.pause();
            talkSound.pause();
            audio.pause();
            clearInterval(callTimerInterval);
            callOverlay.style.display = 'none';
            contactForm.style.display = 'block';
            document.getElementById('initialForm').style.display = 'block';
        }

        function startChat() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            if (!name || !email) {
                alert('Please enter both name and email.');
                return;
            }
            document.getElementById('initialForm').style.display = 'none';
            document.getElementById('chatInterface').style.display = 'block';
            document.getElementById('formName').value = name;
            document.getElementById('formEmail').value = email;
            const typingIndicator = document.getElementById('typingIndicator');
            typingIndicator.style.display = 'block';

            audio.currentTime = 0;
            audio.play().catch(() => {});

            setTimeout(() => {
                typingIndicator.style.display = 'none';
                // TRANSLATED FIRST MESSAGE
                const lang = localStorage.getItem('language') || 'en';
                addMessage('bot', translations[lang]["contact.bot_first_message"], 'katana-king-avatar.png');
                playNotificationSound();
            }, 1500);
        }

        function playNotificationSound() {
            notificationSound.currentTime = 0;
            notificationSound.play().catch(() => {});
        }

        function addMessage(sender, text, avatar = 'user-avatar.png') {
            const chatBox = document.getElementById('chatBox');
            const div = document.createElement('div');
            div.className = `message ${sender === 'bot' ? 'bot-message' : 'user-message'}`;
            div.innerHTML = `<img src="${avatar}" alt="avatar"> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            if (sender === 'user') {
                saveMessage(text);
                playNotificationSound();
            }
        }

        function saveMessage(message) {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const messages = JSON.parse(localStorage.getItem('contactMessages') || '[]');
            messages.push({ name, email, message, timestamp: new Date().toISOString() });
            localStorage.setItem('contactMessages', JSON.stringify(messages));
        }

        document.getElementById('messageForm').addEventListener('submit', function(e) {
            const msg = document.getElementById('message').value.trim();
            if (!msg) {
                e.preventDefault();
                alert('Please enter a message.');
                return;
            }
            addMessage('user', msg, 'user-avatar.png');
        });
    </script>
</body>
</html>
